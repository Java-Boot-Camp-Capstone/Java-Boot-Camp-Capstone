# Trivy time-boxed risk exceptions (Module 40/51: "a finding needs a fix or an owned, dated exception").
# Each entry has an owner, a reason, and an expiry. After `expired_at` the finding BLOCKS the build again.
# Reviewed in weekly security triage - see docs/documentation/security-baseline.md (Residual risks).
vulnerabilities:
