    statement: >-
      spring-webmvc 6.2.x CRITICAL - fix only in Spring Framework 7.0.9 (Spring Boot 4 major upgrade).
      Owner: backend team. Mitigation: JWT deny-by-default API, training cluster only, synthetic data.
      Action: plan Boot 4 migration, or adopt a 6.2.x patch if released.
    expired_at: 2026-11-30
  - id: CVE-2026-47890
    statement: spring-webmvc 6.2.x CRITICAL - same as CVE-2026-47884. Owner backend team.
