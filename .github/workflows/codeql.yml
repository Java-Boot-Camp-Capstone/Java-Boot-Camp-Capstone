# Code scanning (SAST) with GitHub CodeQL - results appear under the repo's Security tab.
# Kept separate from CI so the CI run stays under 2 minutes; it runs on pull requests (merge gate),
# on main/Development, weekly, and on demand (Actions tab -> CodeQL -> Run workflow).

name: CodeQL

on:
  push:
    branches: [main, Development]
  pull_request:
    branches: [main, Development]
  schedule:
    - cron: "0 6 * * 1"       # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
