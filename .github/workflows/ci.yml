# Northstar CRM - CI/CD pipeline (Lab 51 gate order)
#
#   secret-scan ─┐
#   backend ─────┤
#   frontend ────┼─> images: build once -> image scan -> e2e smoke + DAST -> push (main/Development) -> digest
#   dep-scan ────┘                                                                 │
#   codeql (parallel, results in the Security tab)                                 └─> deploy (k3s, by digest, gated)
#
# Run it from the Actions tab: Actions -> CI -> "Run workflow" (pick branch + publish/deploy options).
# Third-party actions are pinned to a full commit SHA (supply-chain hardening); the tag is in the comment.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, Development]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push images to GHCR (always on for main/Development pushes)"
        type: boolean
        default: false
      deploy:
        description: "Deploy the published images to k3s (needs the environment's secrets)"
        type: boolean
        default: false
      environment:
        description: "k3s target environment"
        type: choice
        options: [dev, staging, production]
        default: dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: GITHUB_TOKEN is read-only by default; jobs that need more ask for it explicitly.
# (Works even when the org greys out "Workflow permissions" and forces read-only defaults.)
permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  ZAP_IMAGE: zaproxy/zap-stable:2.17.0

jobs:
  # Skips jobs cleanly on branches that do not contain backend/ or frontend/ yet.
  detect:
    name: Detect components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          [ -f backend/pom.xml ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo \
            --redact --no-banner --report-format json --report-path /repo/gitleaks-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-gitleaks
          path: gitleaks-report.json
          if-no-files-found: ignore

  backend:
    name: Backend - Maven verify
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test (unit + AuthorizationTests 401/403/200)
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend - Angular test + build
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # ubuntu-24.04 blocks Chrome's user-namespace sandbox; wrap Chrome with --no-sandbox (CI only)
      - name: Configure headless Chrome for CI
        run: |
          printf '#!/bin/sh\nexec %s --no-sandbox "$@"\n' "$(command -v google-chrome)" > "$RUNNER_TEMP/chrome-ci"
          chmod +x "$RUNNER_TEMP/chrome-ci"
          echo "CHROME_BIN=$RUNNER_TEMP/chrome-ci" >> "$GITHUB_ENV"
      - name: Unit tests (headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage
      - name: Production build
        run: npx ng build --configuration production
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  dependency-scan:
    name: Dependency scan (npm lockfile, HIGH+)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Maven libraries are scanned inside the built backend image (images job) - the same jar that ships.
      - name: Trivy fs - frontend/package-lock.json
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE" fs --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /repo/.trivyignore.yaml \
            --format table --output /repo/reports/trivy-npm.txt --exit-code 1 /repo/frontend/package-lock.json
      - name: Show report
        if: always()
        run: cat reports/trivy-npm.txt 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-dependency-scan
          path: reports/
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  codeql:
    name: CodeQL SAST (${{ matrix.language }})
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            component: backend
          - language: javascript-typescript
            component: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip if component missing
        id: gate
        env:
          HAS_BACKEND: ${{ needs.detect.outputs.backend }}
          HAS_FRONTEND: ${{ needs.detect.outputs.frontend }}
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then echo "run=$HAS_BACKEND" >> "$GITHUB_OUTPUT"; else echo "run=$HAS_FRONTEND" >> "$GITHUB_OUTPUT"; fi
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: steps.gate.outputs.run == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: steps.gate.outputs.run == 'true'
        with:
          category: /language:${{ matrix.language }}

  images:
    name: Images - build, scan, e2e smoke, publish
    needs: [detect, secret-scan, backend, frontend, dependency-scan]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.detect.outputs.backend == 'true' && needs.detect.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # only this job may push to GHCR
    outputs:
      published: ${{ steps.flags.outputs.publish }}
      backend_image: ${{ steps.push.outputs.backend_image }}
      frontend_image: ${{ steps.push.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide publish + image names
        id: flags
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_DEPLOY: ${{ inputs.deploy }}
        run: |
          publish=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && { [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_REF" = "refs/heads/Development" ]; }; then publish=true; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && { [ "$INPUT_PUBLISH" = "true" ] || [ "$INPUT_DEPLOY" = "true" ]; }; then publish=true; fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "publish=$publish"
            echo "backend=ghcr.io/$owner/northstar-crm-backend"
            echo "frontend=ghcr.io/$owner/northstar-crm-frontend"
          } >> "$GITHUB_OUTPUT"
          echo "publish=$publish"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.flags.outputs.backend }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
      - id: meta-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.flags.outputs.frontend }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      # 1) BUILD ONCE - loaded into the runner's Docker, not pushed yet
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          push: false
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          load: true
          push: false
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # 2) SCAN BEFORE PUSH - CRITICAL blocks; Java libraries in the jar block at HIGH (exceptions: .trivyignore.yaml)
      - name: Trivy image scan (gate)
        env:
          BACKEND_REF: ${{ steps.flags.outputs.backend }}:sha-${{ github.sha }}
          FRONTEND_REF: ${{ steps.flags.outputs.frontend }}:sha-${{ github.sha }}
        run: |
          mkdir -p reports && chmod 777 reports
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo" -v trivy-cache:/root/.cache \
                      "$TRIVY_IMAGE" "$@" --quiet --scanners vuln --ignore-unfixed --ignorefile /repo/.trivyignore.yaml; }
          # evidence reports (never fail)
          trivy image --severity HIGH,CRITICAL --format table --output /repo/reports/trivy-backend.txt "$BACKEND_REF"
          trivy image --severity HIGH,CRITICAL --format table --output /repo/reports/trivy-frontend.txt "$FRONTEND_REF"
          # gates
          rc=0
          trivy image --severity CRITICAL --exit-code 1 "$BACKEND_REF"  || rc=1
          trivy image --severity CRITICAL --exit-code 1 "$FRONTEND_REF" || rc=1
          trivy image --pkg-types library --severity HIGH,CRITICAL --exit-code 1 "$BACKEND_REF" || rc=1
          cat reports/trivy-backend.txt reports/trivy-frontend.txt
          exit $rc

      # 3) E2E SMOKE + DAST against the exact images that will be pushed
      - name: Start stack (docker compose, throwaway CI secrets)
        env:
          BACKEND_IMAGE: ${{ steps.flags.outputs.backend }}:sha-${{ github.sha }}
          FRONTEND_IMAGE: ${{ steps.flags.outputs.frontend }}:sha-${{ github.sha }}
        run: |
          gen() { openssl rand -hex 24; }
          {
            echo "POSTGRES_PASSWORD=$(gen)"
            echo "APP_JWT_SECRET=$(gen)$(gen)"
            echo "APP_DEMO_AGENT_PASSWORD=$(gen)"
            echo "APP_DEMO_MANAGER_PASSWORD=$(gen)"
          } > "$RUNNER_TEMP/ci.env"
          while IFS='=' read -r _ v; do echo "::add-mask::$v"; done < "$RUNNER_TEMP/ci.env"
          docker compose --env-file "$RUNNER_TEMP/ci.env" up -d --no-build --wait --wait-timeout 300
          docker compose --env-file "$RUNNER_TEMP/ci.env" ps
      - name: Smoke test (401 / 400 / 200 / 201)
        run: |
          set -a; . "$RUNNER_TEMP/ci.env"; set +a
          AGENT_PASSWORD="$APP_DEMO_AGENT_PASSWORD" SMOKE_LABEL="docker compose (CI)" bash scripts/smoke-test.sh
      - name: DAST - OWASP ZAP baseline (report only)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://localhost:4200 -r zap-report.html -J zap-report.json -I || true
          ls zap
      - name: Container logs on failure
        if: failure()
        run: docker compose --env-file "$RUNNER_TEMP/ci.env" logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/ci.env" down -v || true

      # 4) PUBLISH the same images (no rebuild) and record their digests
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.flags.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images + record digests
        id: push
        env:
          PUBLISH: ${{ steps.flags.outputs.publish }}
          BACKEND_REPO: ${{ steps.flags.outputs.backend }}
          FRONTEND_REPO: ${{ steps.flags.outputs.frontend }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          backend_image="not-published"; frontend_image="not-published"
          if [ "$PUBLISH" = "true" ]; then
            docker push --all-tags "$BACKEND_REPO"
            docker push --all-tags "$FRONTEND_REPO"
            backend_image=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$BACKEND_REPO:sha-$GITHUB_SHA" | grep "^$BACKEND_REPO@" | head -1)
            frontend_image=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$FRONTEND_REPO:sha-$GITHUB_SHA" | grep "^$FRONTEND_REPO@" | head -1)
          fi
          echo "backend_image=$backend_image" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$frontend_image" >> "$GITHUB_OUTPUT"
          cat > reports/release-manifest.json <<EOF
          {
            "gitSha": "$GITHUB_SHA",
            "ref": "$GITHUB_REF_NAME",
            "pipelineRunUrl": "$RUN_URL",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "published": $PUBLISH,
            "backendImage": "$backend_image",
            "frontendImage": "$frontend_image",
            "backendImageId": "$(docker inspect --format '{{.Id}}' "$BACKEND_REPO:sha-$GITHUB_SHA")",
            "frontendImageId": "$(docker inspect --format '{{.Id}}' "$FRONTEND_REPO:sha-$GITHUB_SHA")"
          }
          EOF
          cat reports/release-manifest.json
          {
            echo "### Release manifest"
            echo '```json'; cat reports/release-manifest.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: |
            reports/
            zap/
          if-no-files-found: ignore

  deploy:
    name: Deploy to k3s (${{ inputs.environment || 'dev' }})
    needs: images
    if: >-
      needs.images.outputs.published == 'true' && (
        (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/Development' && vars.K3S_AUTO_DEPLOY == 'true')
      )
    # GitHub-hosted runners must be able to reach the k3s API server. If the cluster is private,
    # set repo variable K3S_RUNNER=self-hosted and register a runner inside that network.
    runs-on: ${{ vars.K3S_RUNNER || 'ubuntu-latest' }}
    environment:
      name: ${{ inputs.environment || 'dev' }}     # protection rules + secrets live on the GitHub Environment
    permissions:
      contents: read
    env:
      ENV_NAME: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write kubeconfig from secret (never echoed, removed after job)
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::error::Secret KUBECONFIG_B64 is not set on the '$ENV_NAME' environment. See docs/documentation/k3s-deployment.md"
            exit 1
          fi
          umask 077
          echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Deploy by digest + smoke + auto-rollback
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || format('crm-{0}', inputs.environment == 'staging' && 'stage' || inputs.environment == 'production' && 'prod' || 'dev') }}
          BACKEND_IMAGE: ${{ needs.images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend_image }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          APP_DEMO_AGENT_PASSWORD: ${{ secrets.APP_DEMO_AGENT_PASSWORD }}
          APP_DEMO_MANAGER_PASSWORD: ${{ secrets.APP_DEMO_MANAGER_PASSWORD }}
          GHCR_PULL_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: bash scripts/k3s-deploy.sh
      - name: Remove kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
