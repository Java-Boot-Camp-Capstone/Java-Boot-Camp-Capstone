# Northstar CRM - CI/CD pipeline
#
#  every push / PR : Java build+test, Angular test+build, CodeQL SAST, Docker build + Trivy scan
#  push to main / Development (or manual run): also push immutable images to GHCR and record digests
#
# Deployment (k3s) consumes the recorded digest - it never rebuilds the image ("package once").

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, Development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  # Skips jobs cleanly on branches that do not contain backend/ or frontend/ yet.
  detect:
    name: Detect components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          [ -f backend/pom.xml ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend - Maven verify
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/crm
      SPRING_DATASOURCE_USERNAME: crm
      SPRING_DATASOURCE_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend - Angular test + build
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # ubuntu-24.04 blocks Chrome's user-namespace sandbox; wrap Chrome with --no-sandbox (CI only)
      - name: Configure headless Chrome for CI
        run: |
          printf '#!/bin/sh\nexec %s --no-sandbox "$@"\n' "$(command -v google-chrome)" > "$RUNNER_TEMP/chrome-ci"
          chmod +x "$RUNNER_TEMP/chrome-ci"
          echo "CHROME_BIN=$RUNNER_TEMP/chrome-ci" >> "$GITHUB_ENV"
      - name: Unit tests (headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage
      - name: Production build
        run: npx ng build --configuration production
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  codeql:
    name: CodeQL SAST (${{ matrix.language }})
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            component: backend
          - language: javascript-typescript
            component: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Skip if component missing
        id: gate
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then echo "run=${{ needs.detect.outputs.backend }}" >> "$GITHUB_OUTPUT"; else echo "run=${{ needs.detect.outputs.frontend }}" >> "$GITHUB_OUTPUT"; fi
      - uses: github/codeql-action/init@v3
        if: steps.gate.outputs.run == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        if: steps.gate.outputs.run == 'true'
        with:
          category: /language:${{ matrix.language }}

  docker:
    name: Docker image - ${{ matrix.component }}
    needs: [detect, backend, frontend]
    # run when the component's tests passed (or the component is absent and was skipped)
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Development' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if component missing
        id: gate
        run: |
          if [ -f "${{ matrix.component }}/Dockerfile" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No ${{ matrix.component }}/ on this branch - skipping"; fi
      - name: Image name (lowercase)
        if: steps.gate.outputs.run == 'true'
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/northstar-crm-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.run == 'true'
      - uses: docker/login-action@v3
        if: steps.gate.outputs.run == 'true' && env.PUBLISH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: steps.gate.outputs.run == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
      - name: Build (and push on main/Development)
        if: steps.gate.outputs.run == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Trivy vulnerability scan
        if: steps.gate.outputs.run == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"   # report-only; set to "1" to make HIGH/CRITICAL a hard gate
          format: table
          output: trivy-${{ matrix.component }}.txt
      - name: Record image digest
        if: steps.gate.outputs.run == 'true'
        run: |
          {
            echo "component=${{ matrix.component }}"
            echo "image=${{ steps.name.outputs.image }}"
            echo "commit=${GITHUB_SHA}"
            echo "digest=${{ steps.build.outputs.digest }}"
            echo "published=${PUBLISH}"
          } > image-${{ matrix.component }}.txt
          cat image-${{ matrix.component }}.txt
          {
            echo "### ${{ matrix.component }} image"
            echo '```'
            cat image-${{ matrix.component }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload image evidence
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-${{ matrix.component }}
          path: |
            image-${{ matrix.component }}.txt
            trivy-${{ matrix.component }}.txt
