# CI - build, test, scan and package Northstar CRM (target: under 2 minutes)
#
# Delivery path (docs/documentation/architecture.md):
#   GitHub -> GitHub Actions -> tests and security checks -> Docker image -> k3s deployment
#
#   backend  job:  mvn verify -> image from the tested jar  -> Trivy scan -> push (main only)
#   frontend job:  ng test + ng build -> image from tested dist -> Trivy scan -> push (main only)
#   release  job:  (main only) records both image digests for the k3s deploy
#
# backend and frontend run in parallel. CodeQL runs in its own workflow (codeql.yml) so it
# never slows this one down. Deploy is a separate workflow (deploy.yml).
#
# Run by hand: Actions tab -> CI -> "Run workflow".

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, Development]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push images to GitHub Container Registry (always on for pushes to main)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN is read-only unless a job asks for more.
permissions:
  contents: read

env:
  # Images are pushed on every push to main (github-actions-plan.md) or when "publish" is ticked.
  PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.publish == true }}
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  backend:
    name: Backend (test, image, scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test and package (mvn verify)
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

      - name: Build image from the tested jar
        id: image
        run: |
          mkdir -p backend/.ci/out && cp backend/target/*.jar backend/.ci/out/app.jar
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/northstar-crm-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          build-contexts: build=backend/.ci        # skip the Maven stage - use the jar we just tested
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # The scanner database is ~3 GB. Download it once a week, then reuse it so scans take seconds.
      - name: Restore Trivy database cache (refreshed weekly)
        id: trivy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.week.outputs.week }}
          restore-keys: trivy-db-
      - name: Security scan (Trivy) - block on CRITICAL, and on HIGH in Java libraries
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          CACHED: ${{ steps.trivy-cache.outputs.cache-matched-key != '' }}
        run: |
          skip=""; [ "$CACHED" = "true" ] && skip="--skip-db-update --skip-java-db-update"
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
                      -v "$PWD:/repo" "$TRIVY_IMAGE" image --quiet --scanners vuln --ignore-unfixed \
                      --ignorefile /repo/.trivyignore.yaml "$@" "$IMAGE"; }
          # shellcheck disable=SC2086
          trivy --severity CRITICAL --exit-code 1 $skip
          trivy --pkg-types library --severity HIGH --exit-code 1 --skip-db-update --skip-java-db-update

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image and record digest
        if: env.PUBLISH == 'true'
        env:
          REPO: ${{ steps.image.outputs.name }}
        run: |
          docker push "$REPO:sha-$GITHUB_SHA"
          docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$REPO:sha-$GITHUB_SHA" | grep "^$REPO@" | head -1 > image-backend.txt
          cat image-backend.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: image-backend
          path: image-backend.txt

  frontend:
    name: Frontend (test, build, image, scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/node_modules
          key: node-modules-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install (npm ci)
        if: steps.npm-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Unit tests (headless Chrome)
        working-directory: frontend
        run: |
          # ubuntu-24.04 blocks Chrome's sandbox for unprivileged users; CI-only workaround
          printf '#!/bin/sh\nexec %s --no-sandbox "$@"\n' "$(command -v google-chrome)" > "$RUNNER_TEMP/chrome-ci"
          chmod +x "$RUNNER_TEMP/chrome-ci"
          CHROME_BIN="$RUNNER_TEMP/chrome-ci" npx ng test --watch=false --browsers=ChromeHeadless
      - name: Production build
        working-directory: frontend
        run: npx ng build --configuration production

      - name: Build image from the tested build output
        id: image
        run: |
          mkdir -p frontend/.ci/out
          src=$(find frontend/dist -mindepth 2 -maxdepth 2 -type d -name browser | head -1)
          [ -n "$src" ] || src=$(find frontend/dist -mindepth 1 -maxdepth 1 -type d | head -1)
          cp -r "$src"/. frontend/.ci/out/
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/northstar-crm-frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          build-contexts: build=frontend/.ci       # skip the Node stage - use the dist we just built
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Trivy database cache (refreshed weekly)
        id: trivy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-fe-${{ steps.week.outputs.week }}
          restore-keys: trivy-db-fe-
      - name: Security scan (Trivy) - block on CRITICAL
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          CACHED: ${{ steps.trivy-cache.outputs.cache-matched-key != '' }}
        run: |
          skip=""; [ "$CACHED" = "true" ] && skip="--skip-db-update"
          # shellcheck disable=SC2086
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD:/repo" "$TRIVY_IMAGE" image --quiet --scanners vuln --ignore-unfixed \
            --ignorefile /repo/.trivyignore.yaml --severity CRITICAL --exit-code 1 $skip "$IMAGE"

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image and record digest
        if: env.PUBLISH == 'true'
        env:
          REPO: ${{ steps.image.outputs.name }}
        run: |
          docker push "$REPO:sha-$GITHUB_SHA"
          docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$REPO:sha-$GITHUB_SHA" | grep "^$REPO@" | head -1 > image-frontend.txt
          cat image-frontend.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: image-frontend
          path: image-frontend.txt

  dependency-review:
    name: Dependency review (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  release:
    name: Release (record image digests)
    needs: [backend, frontend]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both images passed tests + scans: tag them with the branch name (no rebuild, same digest).
      - name: Tag tested images and write release manifest
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          backend=$(cat image-backend.txt); frontend=$(cat image-frontend.txt)
          tag="${GITHUB_REF_NAME//\//-}"
          # --prefer-index=false: copy the manifest as-is so the tag points at the SAME digest CI scanned
          # (the default wraps it in a new index with a different digest).
          docker buildx imagetools create --prefer-index=false -t "${backend%@*}:$tag" "$backend"
          docker buildx imagetools create --prefer-index=false -t "${frontend%@*}:$tag" "$frontend"
          cat > release-manifest.json <<EOF
          {
            "gitSha": "$GITHUB_SHA",
            "branch": "$GITHUB_REF_NAME",
            "pipelineRun": "$RUN_URL",
            "backendImage": "$backend",
            "frontendImage": "$frontend"
          }
          EOF
          { echo "### Release manifest (deploy uses these digests)"; echo '```json'; cat release-manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: release-manifest.json
