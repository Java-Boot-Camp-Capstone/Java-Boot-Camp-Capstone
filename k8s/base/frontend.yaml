apiVersion: v1
kind: Service
metadata:
  name: crm-frontend
  labels: { app: crm-frontend }
spec:
  selector: { app: crm-frontend }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-frontend
  labels: { app: crm-frontend }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: crm-frontend }
  template:
    metadata:
      labels: { app: crm-frontend }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101              # nginx-unprivileged
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: northstar-crm-frontend     # rewritten to ghcr.io/...@sha256:<digest> by the deploy job
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom: { configMapKeyRef: { name: crm-config, key: BACKEND_URL } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
